name: CI build
on:
  workflow_run:
    workflows: ["CI"]
    types: ["completed"]
    branches: [master]
# One release at a time; never cancel a release that is already tagging or publishing.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  on-success:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      # Release only the commit CI passed for. If master moved on, CI for the new tip triggers the release.
      - name: Check that master is the commit CI verified
        id: head
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$VERIFIED_SHA" ]; then
            echo "verified=true" >> "$GITHUB_OUTPUT"
          else
            echo "master is at $(git rev-parse HEAD), not $VERIFIED_SHA; skipping the release"
            echo "verified=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - name: Set up Git commit author
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
      - name: Get current version
        id: before
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      - name: Run release-it
        if: steps.head.outputs.verified == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release -- --ci
      - name: Check if released
        id: release
        if: steps.head.outputs.verified == 'true'
        run: |
          AFTER=$(node -p "require('./package.json').version")
          if [ "${{ steps.before.outputs.version }}" != "$AFTER" ]; then
            echo "Released v$AFTER"
            echo "released=true" >> $GITHUB_OUTPUT
          else
            echo "No new version to release"
            echo "released=false" >> $GITHUB_OUTPUT
          fi
      - name: Publish to npm
        if: steps.release.outputs.released == 'true'
        run: npx --yes npm@latest publish --access public --provenance
